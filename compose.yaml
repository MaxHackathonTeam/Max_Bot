name: afisha

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: afisha-backend:local
  env_file:
    - path: .env
      required: false
  environment:
    # Приложение — под ролью afisha_app (без DDL, audit_log только INSERT).
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://afisha_app:afisha_app@db:5432/afisha}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    # Вход вне MAX с фейковой initData (только локально; в compose.prod.yaml — "0").
    DEV_AUTH: ${DEV_AUTH:-0}
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: afisha
      POSTGRES_USER: afisha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afisha}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U afisha -d afisha"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    # Миграции — под владельцем БД; затем роли приложения включается вход;
    # затем демо-набор (только при SEED_DEMO=1, повторный запуск идемпотентен).
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.roles && python -m app.seed"]
    environment:
      SEED_DEMO: ${SEED_DEMO:-1}
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:-postgresql+asyncpg://afisha:afisha@db:5432/afisha}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-afisha_app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media-data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["arq", "--custom-log-dict", "app.workers.settings.ARQ_LOG_CONFIG", "app.workers.settings.WorkerSettings"]
    volumes:
      - media-data:/app/media
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.settings.WorkerSettings"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  bot-poller:
    <<: *backend
    command: ["python", "-m", "app.bot.poller"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://afisha_app:afisha_app@db:5432/afisha}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BOT_MODE: polling
    healthcheck:
      disable: true
    profiles: ["local"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    image: afisha-web:local
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  media-data:
