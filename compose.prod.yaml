# Прод: docker compose -f compose.yaml -f compose.prod.yaml up -d --build
# Наружу торчит только Caddy (80/443), TLS — Let's Encrypt.
services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задай POSTGRES_PASSWORD в .env}

  api:
    ports: !reset []
    environment:
      ENV: prod
      DEV_AUTH: "0"
      BOT_MODE: webhook
      DATABASE_URL: ${DATABASE_URL:?Задай DATABASE_URL в .env}

  migrate:
    environment:
      ENV: prod
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:?Задай MIGRATE_DATABASE_URL в .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Задай APP_DB_PASSWORD в .env}

  worker:
    environment:
      ENV: prod
      DATABASE_URL: ${DATABASE_URL:?Задай DATABASE_URL в .env}

  web:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Задай DOMAIN в .env}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
