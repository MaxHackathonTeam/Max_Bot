<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Афиша рядом</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#faf5eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1712" media="(prefers-color-scheme: dark)" />
    <script>
      // Тема до первой отрисовки (без мигания). Логика и ключ — как в src/app/theme.ts.
      (function () {
        var pref = "system";
        try {
          var saved = localStorage.getItem("afisha.theme");
          if (saved === "light" || saved === "dark") pref = saved;
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        if (pref !== "system") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", dark ? "#1b1712" : "#faf5eb");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
